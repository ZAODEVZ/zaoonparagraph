<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zao onparagraph</title>
    <style>
      :root {
        --bg: #0d0f12;
        --card: #14171c;
        --line: #232830;
        --ink: #e8ebf0;
        --dim: #8a93a2;
        --cyan: #4dd0e1;
        --green: #66bb6a;
        --yellow: #ffca28;
        --magenta: #ce93d8;
        --blue: #64b5f6;
        --red: #ef5350;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
        padding: 24px;
      }
      header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
      h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; }
      .dim { color: var(--dim); }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      .card h2 { font-size: 13px; margin: 0 0 12px; color: var(--dim); text-transform: lowercase; letter-spacing: 0.5px; }
      .bar { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 8px 0; }
      .bar > span { display: block; height: 100%; background: var(--cyan); }
      .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line); }
      .row:last-child { border-bottom: none; }
      .chip { padding: 1px 8px; border-radius: 999px; font-size: 11px; }
      .draft { color: var(--dim); }
      .review { color: var(--yellow); }
      .approved { color: var(--blue); }
      .locked { color: var(--magenta); }
      .published { color: var(--green); }
      .ok { color: var(--green); }
      .flag { color: var(--red); }
      .peak { color: var(--cyan); }
      footer { margin-top: 24px; color: var(--dim); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>zao onparagraph</h1>
      <span class="dim">sidecar dashboard · <span id="clock"></span></span>
    </header>
    <div class="grid" id="grid">loading...</div>
    <footer>build on · zabal team</footer>

    <script>
      const stageClass = (s) => ({ draft: "draft", review: "review", approved: "approved", locked: "locked", published: "published" }[s] || "draft");

      function archiveCard(a) {
        const pct = a.pct ?? 0;
        return `<div class="card"><h2>archive index</h2>
          <div class="bar"><span style="width:${pct}%"></span></div>
          <div class="row"><span>${a.indexed}/${a.target} issues</span><span class="peak">${pct}%</span></div>
          <div class="row"><span>status</span><span>${a.status}</span></div></div>`;
      }

      function laneCard(lane, drafts) {
        const items = drafts.filter((d) => d.lane === lane);
        const rows = items.length
          ? items.map((d) => `<div class="row"><span>${d.file}</span>
              <span><span class="chip ${stageClass(d.stage)}">${d.stage}</span>
              <span class="${d.onVoice ? "ok" : "flag"}">${d.onVoice ? "voice ok" : "flag"}</span></span></div>`).join("")
          : `<div class="row dim">no drafts</div>`;
        return `<div class="card"><h2>/${lane}</h2>${rows}</div>`;
      }

      function statsCard(stats) {
        const rows = stats.length
          ? stats.map((s) => s.error
              ? `<div class="row"><span>${s.id}</span><span class="flag">${s.error}</span></div>`
              : `<div class="row"><span>${s.id}</span><span>${s.views} views · ${s.clickRate}% · +${s.subs}</span></div>`).join("")
          : `<div class="row dim">no collections configured</div>`;
        return `<div class="card"><h2>collection stats</h2>${rows}</div>`;
      }

      function peaksCard(peaks, dispatch) {
        const p = peaks.map((s) => `<div class="row"><span class="peak">${s.label}</span><span class="dim">${new Date(s.iso).toLocaleString()}</span></div>`).join("");
        const d = dispatch.length
          ? dispatch.map((x) => `<div class="row"><span>${x.postId}</span><span class="${x.queued ? "ok" : "flag"}">${x.slot}</span></div>`).join("")
          : `<div class="row dim">no dispatches yet</div>`;
        return `<div class="card"><h2>social dispatch</h2>${p}<div class="row dim">— log —</div>${d}</div>`;
      }

      async function refresh() {
        try {
          const s = await (await fetch("/state")).json();
          const grid = document.getElementById("grid");
          grid.innerHTML =
            archiveCard(s.archive) +
            s.lanes.map((l) => laneCard(l, s.drafts)).join("") +
            statsCard(s.stats) +
            peaksCard(s.peaks, s.dispatch);
        } catch (e) {
          document.getElementById("grid").innerHTML = '<div class="card flag">cannot reach /state</div>';
        }
      }

      function tick() {
        document.getElementById("clock").textContent = new Date().toLocaleTimeString();
      }
      setInterval(refresh, 5000);
      setInterval(tick, 1000);
      refresh();
      tick();
    </script>
  </body>
</html>
